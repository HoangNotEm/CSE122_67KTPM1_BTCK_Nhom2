<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu – CropMate AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="public-page">
  <nav class="public-nav" aria-label="Điều hướng chính">
    <a class="brand" href="../index.html"><span class="brand__logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 13c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg></span><span>CropMate AI</span></a>
    <div class="public-nav__links">
      <a href="../index.html">Trang chủ</a>
      <a href="login.html">Đăng nhập</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card" id="auth-card">
      <div class="auth-card__brand">
        <span class="brand__logo" style="width:44px;height:44px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 13c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg></span>
      </div>
      <h1>Khôi phục mật khẩu</h1>
      <p class="auth-card__sub">Nhập email đã đăng ký — chúng tôi sẽ gửi link đặt lại mật khẩu cho bạn.</p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label class="field__label" for="email">Email <span class="req">*</span></label>
          <input class="input" type="email" id="email" name="email" placeholder="vidu@gmail.com" data-rules="required|email" autocomplete="email">
          <div class="field__error"></div>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="btn-send">Gửi link khôi phục</button>
      </form>

      <div class="auth-alt"><a href="login.html">Quay lại đăng nhập</a></div>
    </div>
  </main>

  <footer class="footer">CropMate AI · BTL môn Phát triển ứng dụng Web cơ bản (CSE122)</footer>
</div>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/modules/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const ui = CM.ui;
  const form = document.getElementById('forgot-form');
  ui.bindLiveValidation(form);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!ui.validateForm(form)) { ui.toast('Vui lòng nhập email hợp lệ.', 'error'); return; }

    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('btn-send');
    btn.disabled = true; btn.innerHTML = '<span class="btn__spinner"></span> Đang gửi...';

    /* Giả lập gửi email 800ms rồi chuyển sang trạng thái thành công */
    setTimeout(function () {
      const existed = CM.api.read('users').some(function (u) { return u.email.toLowerCase() === email.toLowerCase(); });
      document.getElementById('auth-card').innerHTML =
        '<div style="text-align:center">' +
          '<span style="width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);display:grid;place-items:center;margin:6px auto 16px">' +
            ui.icon('check', 'style="width:30px;height:30px"') +
          '</span>' +
          '<h1>Đã gửi email khôi phục</h1>' +
          '<p class="auth-card__sub">Chúng tôi đã gửi link đặt lại mật khẩu đến <strong style="color:var(--text-main);">'+email+'</strong> (mô phỏng — không gửi email thật).</p>' +
          (existed
            ? ''
            : '<p class="small" style="color:var(--warning)">Email chưa đăng ký trong hệ thống — bạn có thể <a href="register.html">tạo tài khoản mới</a>.</p>') +
          '<a class="btn btn--primary btn--block" href="login.html">Quay lại đăng nhập</a>' +
        '</div>';
    }, 800);
  });
});
</script>
</body>
</html>
